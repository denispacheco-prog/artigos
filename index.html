<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data: blob:; font-src 'self'; connect-src 'self' https://api.github.com; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <meta name="referrer" content="no-referrer" />
  <title>Artigos</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g fill='none' stroke='%2386ade0' stroke-width='7' stroke-linejoin='round' stroke-linecap='round'><path d='M50 26C40 18 26 16 14 18v58c12-2 26 0 36 8 10-8 24-10 36-8V18c-12-2-26 0-36 8z'/><path d='M50 26v58'/></g></svg>" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="fonts/fontes.css" />
  <link rel="stylesheet" href="css/app.css" />
  <script src="js/tema-inicial.js"></script>
</head>
<body>
  <!-- ===== Lista ===== -->
  <div id="vista-lista" class="vista-lista">
    <header class="app-header">
      <h1 class="wordmark">
        <a href="#/">
          <svg class="wordmark-icon" viewBox="10 12 80 76" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M50 26C40 18 26 16 14 18v58c12-2 26 0 36 8 10-8 24-10 36-8V18c-12-2-26 0-36 8z"/><path d="M50 26v58"/></svg>
          Artigos
        </a>
      </h1>
      <div class="app-header-actions">
        <label class="search-field">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
          <input id="busca" type="search" placeholder="Buscar por título, site, autor…" autocomplete="off" aria-label="Buscar" />
        </label>
        <div class="app-header-controls">
          <button id="btn-salvar" type="button" class="btn-primario">+ Salvar</button>
          <button type="button" class="icon-btn js-tema" title="Alternar tema" aria-label="Alternar tema"></button>
        </div>
      </div>
    </header>

    <main class="layout">
      <aside class="lateral">
        <section>
          <h2 class="titulo-secao">Ler</h2>
          <nav id="filtros" class="filtros" aria-label="Filtros"></nav>
        </section>
        <section>
          <h2 class="titulo-secao">Tags</h2>
          <div id="nuvem-tags" class="nuvem-tags"></div>
        </section>
      </aside>

      <div class="conteudo">
        <div id="filtros-ativos" class="filtros-ativos" hidden></div>
        <p id="contagem" class="contagem"></p>
        <ul id="lista" class="lista"></ul>
        <p id="vazio" class="vazio" hidden></p>
      </div>
    </main>
  </div>

  <!-- ===== Leitura ===== -->
  <div id="vista-leitura" class="vista-leitura" hidden>
    <div id="progresso" class="progresso" aria-hidden="true"></div>
    <header id="barra-leitura" class="barra-leitura">
      <a href="#/" class="icon-btn" title="Voltar à lista (Esc)" aria-label="Voltar à lista">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <span id="barra-titulo" class="barra-titulo"></span>
      <div class="barra-acoes">
        <button id="btn-prefs" type="button" class="icon-btn btn-aa" title="Preferências de leitura" aria-label="Preferências de leitura" aria-expanded="false" aria-controls="painel-prefs">Aa</button>
        <button id="btn-favorito" type="button" class="icon-btn" aria-label="Favoritar"></button>
        <button id="btn-arquivar" type="button" class="icon-btn" aria-label="Arquivar"></button>
        <a id="btn-original" class="icon-btn" target="_blank" rel="noopener noreferrer" title="Abrir o original" aria-label="Abrir o original">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
        </a>
        <button type="button" class="icon-btn js-tema" title="Alternar tema" aria-label="Alternar tema"></button>
      </div>
    </header>
    <div id="painel-prefs" class="painel-prefs" role="dialog" aria-label="Preferências de leitura" hidden></div>

    <div id="leitura" class="leitura">
      <article id="artigo" class="artigo"></article>
    </div>
  </div>

  <dialog id="dialogo-salvar" class="dialogo">
    <div class="dialogo-cabecalho">
      <h2>Salvar artigo</h2>
      <button type="button" class="icon-btn js-fechar" aria-label="Fechar">✕</button>
    </div>
    <p>No modo local (M2), os artigos entram pelo terminal do VS Code:</p>
    <pre>npm run extrair -- "https://endereço-do-artigo"</pre>
    <p class="dica">Depois, recarregue esta página. Salvar colando a URL aqui chega no M4.</p>
  </dialog>

  <div id="aviso" class="aviso" role="status" aria-live="polite" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
